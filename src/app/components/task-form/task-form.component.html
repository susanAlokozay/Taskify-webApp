<div class="container mt-4">
    <h2>Add New Task</h2>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
  
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" id="title" class="form-control" formControlName="title">
        <div class="text-danger" *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched">
          Title is required.
        </div>
      </div>
  
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" class="form-control" formControlName="description"></textarea>
      </div>
  
      <div class="form-check mb-3">
        <input type="checkbox" id="completed" class="form-check-input" formControlName="completed">
        <label for="completed" class="form-check-label">Mark as completed</label>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">Add Task</button>
    </form>
  </div>
