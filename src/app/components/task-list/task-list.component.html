<div class="task-grid">
  <mat-card *ngFor="let task of tasks" class="task-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ task.title }}</mat-card-title>
      <mat-card-subtitle>{{ task.completed ? 'Completed' : 'Pending' }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ task.description }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-stroked-button color="primary" [routerLink]="['/tasks/edit', task.id]">
        <mat-icon class="me-1">edit</mat-icon> Edit
      </button>
      <button mat-stroked-button color="warn" (click)="deleteTask(task.id)">
        <mat-icon class="me-1">delete</mat-icon> Delete
      </button>
    </mat-card-actions>
  </mat-card>
</div>
